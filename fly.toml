app = 'klassno-school-ayudenko'
primary_region = 'fra'
kill_signal = 'SIGTERM'
kill_timeout = 15

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  HOST = '0.0.0.0'
  PORT = '3000'
  DB_PATH = '/data/klassno/klassno.sqlite'
  ALLOWED_ORIGINS = 'https://klassno-school-ayudenko.fly.dev,capacitor://localhost,http://localhost'
  PUBLIC_URL = 'https://klassno-school-ayudenko.fly.dev'

[mounts]
  source = 'klassno_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
